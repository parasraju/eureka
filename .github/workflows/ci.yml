name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly: Monday 06:00 UTC — discovery digest

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests + coverage gate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          pip install -e '.[dev]'
      - name: Full test suite
        run: python -m pytest -q -p no:cacheprovider
      - name: Scoring-code coverage gate (>= 85%)
        run: >-
          python -m pytest -q -p no:cacheprovider
          --cov=src/cbf/metrics
          --cov=src/cbf/judging/bias.py
          --cov=src/cbf/judging/calibration.py
          --cov=src/cbf/discovery/ranker.py
          --cov=src/cbf/discovery/registry_db.py
          --cov=src/cbf/storage
          --cov-report=term-missing
          --cov-fail-under=85

  discover-digest:
    name: Weekly benchmark discovery digest
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e .
      - name: Discover benchmarks from live sources
        run: python -m cbf.cli discover --since 7 --digest --digest-days 7 -o json > digest.md 2> digesterr.log || true
      - name: Upload discovery digest
        uses: actions/upload-artifact@v4
        with:
          name: discovery-digest
          path: |
            digest.md
            digesterr.log
            data/discovery/*.json
          retention-days: 14
        continue-on-error: true